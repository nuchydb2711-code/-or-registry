<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://localhost:* http://127.0.0.1:*; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>เข้าสู่ระบบ · OR Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="loginwrap">
  <div class="logincard">
    <a class="brand" href="login.html"><i>✚</i>OR Registry</a>
    <h1>เข้าสู่ระบบ</h1>
    <p class="s">ระบบทะเบียนผู้ป่วยห้องผ่าตัด</p>
    <div id="msg"></div>
    <form id="f" autocomplete="on" novalidate>
      <div><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div><label for="pw">รหัสผ่าน</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" id="go" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="note" style="margin-top:16px;text-align:center">หากยังไม่มีบัญชี หรือลืมรหัสผ่าน กรุณาติดต่อผู้ดูแลระบบ</p>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
